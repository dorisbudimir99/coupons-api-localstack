services:
  localstack:
    image: localstack/localstack:4.14.0
    container_name: coupons-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=iam,lambda,apigateway,dynamodb,logs,cloudwatch,sts
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack-data-v414:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  localstack-data-v414:
